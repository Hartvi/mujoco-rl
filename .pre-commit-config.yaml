repos:
  # 1. Clean code formatting (Black)
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: ["--line-length=88"]

  # 2. Remove unused imports before sorting the remaining imports
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        name: autoflake (remove unused imports)
        args: ["--in-place", "--remove-all-unused-imports"]

  # 3. Sort imports in place (isort auto-fixes by default)
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (sort imports)
        args: [
          "--profile", "black",
          "--line-length", "88",
          "--py", "39",
          "--atomic",
          "--trailing-comma",
          "--multi-line", "3",
          "--lines-after-imports", "2",
          "--force-alphabetical-sort-within-sections"
        ]

  # 4. Code style verification (Flake8)
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear        # Catches common programming bugs
          - flake8-comprehensions # Enforces clean list/dict comprehensions
          - flake8-pyproject      # Allows loading options from pyproject.toml
        # Config lives in [tool.flake8] in pyproject.toml.

  # 5. Static type enforcement (Mypy)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [
          types-requests,
          types-python-dateutil
        ]
        # Config lives in [tool.mypy] in pyproject.toml.

  # 6. Shell script linting (ShellCheck)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # 7. Core hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: debug-statements
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # 8. Project test suite
  - repo: local
    hooks:
      - id: bowling-environment-tests
        name: Run bowling environment unit tests
        entry: python -m unittest -v test_bowling_environment.py
        language: system
        pass_filenames: false
        always_run: true
